<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess</title>
  <style>
    :root { --ink:#f4ecdf; --muted:#cbbda8; --light:#edd7b0; --dark:#b58863; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: radial-gradient(ellipse at top, #3a2a1c 0%, #14100c 58%, #0b0907 100%);
    }
    .wrap { width: min(94vw, 560px); padding: 18px 16px 22px; }
    h1 {
      margin: 0 0 4px;
      text-align: center;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 22px;
    }
    .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 10px 12px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
    }
    #status { font-size: 13px; }
    .board-frame {
      padding: 14px;
      border-radius: 16px;
      background: linear-gradient(160deg, #7a5530, #3d2816 50%, #2a1b0e);
      box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18);
    }
    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border-radius: 6px;
    }
    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(20px, 5.6vw, 36px);
      line-height: 1;
      user-select: none;
      background: var(--light);
    }
    .cell:nth-child(16n+2),
    .cell:nth-child(16n+4),
    .cell:nth-child(16n+6),
    .cell:nth-child(16n+8),
    .cell:nth-child(16n+9),
    .cell:nth-child(16n+11),
    .cell:nth-child(16n+13),
    .cell:nth-child(16n+15) { background: var(--dark); }
    .cell.selected { box-shadow: inset 0 0 0 3px #f6e19a; }
    .cell.valid:after {
      content: "";
      position: absolute;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      background: rgba(20, 80, 30, .35);
    }
    .cell.capture:after {
      width: 78%;
      height: 78%;
      background: transparent;
      border: 3px solid rgba(20, 80, 30, .38);
    }
    .cell.check { background: #d36b6b !important; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 14px;
    }
    button, select {
      border: 0;
      border-radius: 8px;
      padding: 8px 12px;
      font: 13px/1.2 Georgia, serif;
      cursor: pointer;
    }
    button {
      background: linear-gradient(#c7924a, #8a5a22);
      color: #fff;
      box-shadow: 0 3px 0 #5a3914;
    }
    button:hover { filter: brightness(1.06); }
    button:disabled { opacity: .45; cursor: default; filter: none; }
    select { background: #2a1d12; color: var(--ink); border: 1px solid rgba(255,255,255,.12); }
    #msg { min-height: 1.2em; margin-top: 10px; text-align: center; color: var(--muted); font-size: 13px; }
  </style>
</head>
